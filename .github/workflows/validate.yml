name: Validate Arrow Escape
on:
  push:
    branches: [main, firebase-foundation]
  pull_request:
    branches: [main]
jobs:
  static-validation:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 22
      - name: Check game scripts and required platform wiring
        run: node scripts/check.mjs
